<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="World Cup 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2744"/>
      <stop offset="0.55" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e08a"/>
      <stop offset="0.5" stop-color="#e7c14a"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#2a6b3f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a6b3f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background (maskable safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="215" r="190" fill="url(#glow)"/>

  <!-- trophy -->
  <g transform="translate(256 196)">
    <!-- handles -->
    <path d="M-86 -70 q-58 6 -58 56 q0 46 58 56 l0 -26 q-30 -8 -30 -30 q0 -24 30 -28 z" fill="url(#gold)"/>
    <path d="M86 -70 q58 6 58 56 q0 46 -58 56 l0 -26 q30 -8 30 -30 q0 -24 -30 -28 z" fill="url(#gold)"/>
    <!-- cup -->
    <path d="M-86 -92 L86 -92 Q86 36 0 70 Q-86 36 -86 -92 Z" fill="url(#gold)"/>
    <!-- cup shine -->
    <path d="M-58 -78 Q-58 18 0 48 Q-30 8 -34 -78 Z" fill="#fff" opacity="0.18"/>
    <!-- stem & base -->
    <rect x="-16" y="64" width="32" height="44" fill="url(#gold)"/>
    <rect x="-60" y="106" width="120" height="22" rx="6" fill="url(#gold)"/>
    <rect x="-78" y="126" width="156" height="26" rx="8" fill="url(#gold)"/>
  </g>

  <!-- football badge -->
  <g transform="translate(256 188)">
    <circle r="40" fill="#fff"/>
    <circle r="40" fill="none" stroke="#0c1322" stroke-width="3"/>
    <path d="M0 -20 l19 14 -7 22 -24 0 -7 -22 z" fill="#0c1322"/>
  </g>

  <!-- 2026 -->
  <text x="256" y="430" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="92" font-weight="800" letter-spacing="4" fill="url(#gold)">2026</text>
</svg>
