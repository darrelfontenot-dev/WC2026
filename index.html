<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Bracket – Live</title>
<style>
:root {
  --navy: #1a2744;
  --navy-light: #2a3a5c;
  --gold: #d4a843;
  --bg: #f0f2f5;
  --card: #fff;
  --border: #d0d5dd;
  --green: #27ae60;
  --red: #e74c3c;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
  --transition: all 0.3s ease;
}

[data-theme="dark"] {
  --navy: #e8ecf1;
  --navy-light: #d0d5dd;
  --gold: #f0c060;
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --shadow: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--navy); transition: var(--transition); line-height: 1.5; }
h1 { text-align: center; color: var(--navy); font-size: 2.5rem; margin: 20px 0 8px; font-weight: 800; letter-spacing: -0.5px; }
.subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 8px; }
.status-bar { text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.status-bar .live { color: var(--green); font-weight: 700; }
.status-bar .error { color: var(--red); font-weight: 700; }
.refresh-btn { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-left: 8px; transition: var(--transition); box-shadow: var(--shadow); }
.refresh-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.refresh-btn:active { transform: translateY(0); }

.theme-toggle { background: var(--card); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 1.2rem; transition: var(--transition); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }
.theme-toggle:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

/* Tabs */
.tabs { display: flex; justify-content: center; gap: 0; margin-bottom: 20px; }
.tab { padding: 10px 28px; background: var(--card); border: 1px solid var(--border); cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--navy); user-select: none; transition: var(--transition); }
.tab:first-child { border-radius: 8px 0 0 8px; }
.tab:last-child { border-radius: 0 8px 8px 0; }
.tab:hover { background: #e8ecf1; }
.tab.active { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); color: #fff; border-color: var(--navy); box-shadow: var(--shadow); }
.panel { display: none; }
.panel.active { display: block; }

/* Groups */
.groups-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 0 20px 24px; max-width: 1400px; margin: 0 auto; }
.group { background: var(--card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); }
.group:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.group-header { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); color: #fff; text-align: center; font-weight: 700; font-size: 0.85rem; padding: 8px; letter-spacing: 1px; }
.group table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
.group th { background: #e8ecf1; padding: 6px 8px; text-align: center; font-weight: 600; color: #555; }
.group th:first-child { text-align: left; padding-left: 10px; min-width: 90px; }
.group td { padding: 6px 8px; text-align: center; border-top: 1px solid var(--border); }
.group td:first-child { text-align: left; padding-left: 10px; font-weight: 600; }
.group-row-even { background: rgba(0,0,0,0.02); }
[data-theme="dark"] .group-row-even { background: rgba(255,255,255,0.02); }
.qualified { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%) !important; }
[data-theme="dark"] .qualified { background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%) !important; color: #fff; }
.eliminated { color: #aaa; opacity: 0.7; }
.group-matches { padding: 6px 8px; border-top: 2px solid var(--border); }
.group-matches h4 { font-size: 0.7rem; color: #888; margin-bottom: 4px; }
.group-match { display: flex; align-items: center; justify-content: space-between; font-size: 0.68rem; padding: 3px 0; border-bottom: 1px solid #f5f5f5; gap: 4px; }
.group-match:last-child { border-bottom: none; }
.gm-team { width: 70px; font-weight: 600; }
.gm-team.right { text-align: right; }
.gm-score { background: var(--navy); color: #fff; padding: 1px 6px; border-radius: 3px; font-weight: 700; min-width: 36px; text-align: center; }
.gm-score.pending { background: #ccc; color: #666; }
.gm-status { font-size: 0.58rem; color: var(--green); font-weight: 600; }

/* Bracket */
.bracket-wrap { overflow-x: auto; padding: 16px 20px; }
.knockout { display: flex; align-items: stretch; justify-content: center; min-width: 1500px; }
.round { display: flex; flex-direction: column; justify-content: space-around; min-width: 150px; padding: 0 6px; }
.round-header { text-align: center; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--navy); letter-spacing: 0.5px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: var(--card); box-shadow: var(--shadow); }
.ko-match { background: var(--card); border: 1px solid var(--border); border-radius: 6px; margin: 6px 0; font-size: 0.75rem; overflow: hidden; transition: var(--transition); box-shadow: var(--shadow); }
.ko-match:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.ko-match.live-match { border-color: var(--green); box-shadow: 0 0 12px rgba(39,174,96,0.4); animation: pulse 2s infinite; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 12px rgba(39,174,96,0.4); }
  50% { box-shadow: 0 0 20px rgba(39,174,96,0.6); }
}
.ko-match .team { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--border); align-items: center; }
.ko-match .team:last-child { border-bottom: none; }
.ko-match .team.winner { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); font-weight: 700; }
[data-theme="dark"] .ko-match .team.winner { background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%); color: #fff; }
.ko-match .team-name { font-weight: 600; }
.ko-match .score { color: var(--navy); font-weight: 700; font-size: 0.9rem; }
.ko-match .match-info { font-size: 0.65rem; color: #888; padding: 4px 10px; background: rgba(0,0,0,0.03); }
[data-theme="dark"] .ko-match .match-info { background: rgba(255,255,255,0.05); }

.final-area { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 180px; padding: 0 12px; }
.trophy { font-size: 3.5rem; margin-bottom: 8px; filter: drop-shadow(0 4px 8px rgba(212,168,67,0.4)); animation: trophyGlow 3s ease-in-out infinite; }

@keyframes trophyGlow {
  0%, 100% { filter: drop-shadow(0 4px 8px rgba(212,168,67,0.4)); }
  50% { filter: drop-shadow(0 6px 12px rgba(212,168,67,0.6)); }
}

.final-label { font-weight: 800; font-size: 1.3rem; color: var(--navy); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.third-label { font-weight: 700; font-size: 0.9rem; color: var(--navy); margin: 16px 0 8px; }
.champion-banner { background: linear-gradient(135deg, var(--gold) 0%, #f0c060 100%); color: var(--navy); font-weight: 800; font-size: 1.1rem; padding: 10px 20px; border-radius: 8px; margin-bottom: 12px; text-align: center; box-shadow: var(--shadow-lg); animation: championPulse 2s ease-in-out infinite; }

@keyframes championPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

/* Config */
.config-bar { text-align: center; padding: 12px; background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%); font-size: 0.8rem; color: #856404; border-radius: 8px; margin: 0 20px 16px; box-shadow: var(--shadow); }
.config-bar input { padding: 6px 12px; font-size: 0.8rem; border: 1px solid #ccc; border-radius: 6px; width: 300px; transition: var(--transition); }
.config-bar input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,168,67,0.2); }
.config-bar a { color: #0056b3; text-decoration: underline; }
.config-bar a:hover { color: #004494; }

/* Match list */
.search-container { text-align: center; margin-bottom: 16px; }
.search-input { padding: 10px 16px; font-size: 0.9rem; border: 1px solid var(--border); border-radius: 8px; width: 100%; max-width: 400px; transition: var(--transition); box-shadow: var(--shadow); }
.search-input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(26,39,68,0.1); }
.match-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.85rem; gap: 8px; transition: var(--transition); }
.match-row:hover { background: rgba(0,0,0,0.02); }
[data-theme="dark"] .match-row:hover { background: rgba(255,255,255,0.02); }
.mr-date { width: 120px; font-size: 0.75rem; color: #888; flex-shrink: 0; }
.mr-home { width: 90px; text-align: right; font-weight: 600; flex-shrink: 0; }
.mr-away { width: 90px; font-weight: 600; flex-shrink: 0; }
.mr-status { width: 60px; font-size: 0.7rem; flex-shrink: 0; font-weight: 600; }
.mr-round { width: 110px; font-size: 0.65rem; color: #888; flex-shrink: 0; }
.mr-venue { flex: 1; text-align: center; font-size: 0.75rem; color: #888; }

@media (max-width: 1000px) { .groups-container { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px) {
  .groups-container { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 8px 16px; }
  h1 { font-size: 1.5rem; margin: 12px 0 2px; }
  .subtitle { font-size: 0.75rem; }
  .status-bar { font-size: 0.68rem; flex-wrap: wrap; padding: 0 8px; }
  .tabs { margin-bottom: 10px; }
  .tab { padding: 8px 14px; font-size: 0.78rem; }
  .config-bar { padding: 6px 8px; }
  .config-bar input { width: 180px; }
  .config-bar span { display: block; margin-top: 4px !important; margin-left: 0 !important; }
}
@media (max-width: 480px) {
  .groups-container { grid-template-columns: 1fr; padding: 0 6px 12px; }
  h1 { font-size: 1.3rem; }
  .tab { padding: 7px 10px; font-size: 0.72rem; }
  .knockout { min-width: unset !important; flex-direction: column; align-items: stretch; padding: 0 4px; }
  .round { min-width: unset; flex-direction: column; padding: 0; margin-bottom: 12px; }
  .round-header { margin-bottom: 4px; }
  .final-area { min-width: unset; padding: 10px 0; }
  .ko-match { font-size: 0.78rem; }
  .ko-match .team { padding: 7px 10px; }
  .ko-match .match-info { font-size: 0.62rem; padding: 3px 10px; }
  .bracket-wrap { padding: 6px 4px; }
  .trophy { font-size: 2.2rem; }
  .gm-team { width: auto; flex: 1; }
  .group table { font-size: 0.68rem; }
  .group-match { font-size: 0.72rem; }
  /* Match list mobile */
  .match-row { flex-wrap: wrap; padding: 8px 6px; gap: 2px; }
  .mr-date { width: 100%; font-size: 0.65rem; order: -1; }
  .mr-home { width: auto; flex: 1; text-align: right; }
  .mr-away { width: auto; flex: 1; }
  .mr-status { width: auto; }
  .mr-round { display: none; }
}
/* Mobile bracket: show rounds stacked with labels */
@media (max-width: 480px) {
  .knockout .round:nth-child(n+6) .round-header::before { content: ''; }
}
</style>

let timer = null;

// API-Football config
let API_KEY = localStorage.getItem('wc2026_apikey') || '';
const API_HOST = 'v3.football.api-sports.io';
const LEAGUE = 1; // FIFA World Cup
const SEASON = 2026;

// ──────────────────────────────────────────────
// FETCH
// ──────────────────────────────────────────────
async function fetchAllData() {
  const el = document.getElementById('statusText');
  el.innerHTML = '<span class="live">\u23F3 Fetching live data...</span>';
  let ok = false;

  // Strategy 1: API-Football (if key provided)
  if (API_KEY) {
    try { await fetchApiFootball(); ok = true; } catch(e) { console.warn('API-Football error:', e); }
  }

  // Strategy 2: ESPN public API (no key)
  if (!ok) {
    try { await fetchESPN(); ok = true; } catch(e) { console.warn('ESPN error:', e); }
  }

  // Strategy 3: football-data.org free tier
  if (!ok) {
    try { await fetchFootballData(); ok = true; } catch(e) { console.warn('football-data.org error:', e); }
  }

  if (ok) {
    lastUpdate = new Date();
    el.innerHTML = `<span class="live">\u25CF Connected</span> \u00B7 Updated ${lastUpdate.toLocaleTimeString('en-US',{timeZone:'America/Chicago'})} CDT`;
  } else {
    el.innerHTML = `<span class="error">\u26A0 Could not reach any data source</span>
      <button class="refresh-btn" onclick="document.getElementById('configBar').style.display='block'">Add API Key</button>`;
    initEmpty();
  }
  renderAll();
}

// ── ESPN ──
async function fetchESPN() {
  try {
    // Standings
    const sr = await fetch('https://site.api.espn.com/apis/v2/sports/soccer/fifa.world/standings');
    if (!sr.ok) throw new Error(`ESPN standings failed: ${sr.status}`);
    const sd = await sr.json();
    if (sd.children) {
      sd.children.forEach(g => {
        const gl = (g.abbreviation || g.name || '').replace('Group ','').trim();
        if (gl.length !== 1) return;
        standings[gl] = (g.standings?.entries || []).map(e => {
          const s = {};
          (e.stats||[]).forEach(x => s[x.name] = parseFloat(x.displayValue)||0);
          return {
            code: e.team?.abbreviation || '???',
            name: e.team?.displayName || '',
            pts: s.points||0, w: s.wins||0, d: s.draws||s.ties||0, l: s.losses||0,
            gf: s.pointsFor||s.goalsFor||0, ga: s.pointsAgainst||s.goalsAgainst||0,
            gd: s.pointDifferential||s.goalDifference||0, mp: (s.wins||0)+(s.draws||s.ties||0)+(s.losses||0)
          };
        });
      });
    }
    // Scoreboard
    const mr = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard');
    if (mr.ok) {
      const md = await mr.json();
      allFixtures = (md.events||[]).map(ev => {
        const c = ev.competitions?.[0];
        const h = c?.competitors?.find(x=>x.homeAway==='home');
        const a = c?.competitors?.find(x=>x.homeAway==='away');
        const st = ev.status?.type?.name||'';
        return {
          home: h?.team?.abbreviation||'', away: a?.team?.abbreviation||'',
          hs: parseInt(h?.score)||0, as: parseInt(a?.score)||0,
          status: st.includes('FULL_TIME')?'FT':st.includes('PROGRESS')?'LIVE':st.includes('HALF')?'HT':'NS',
          date: ev.date||'', round: ev.season?.type?.abbreviation||'',
          venue: c?.venue?.fullName||''
        };
      });
      bucketGroupMatches();
    }
  } catch (error) {
    console.error('ESPN fetch error:', error);
    throw error;
  }
}

// ── API-Football ──
async function fetchApiFootball() {
  try {
    const hdr = { 'x-apisports-key': API_KEY };
    const sr = await fetch(`https://${API_HOST}/standings?league=${LEAGUE}&season=${SEASON}`, {headers:hdr});
    if (!sr.ok) throw new Error(`API-Football standings failed: ${sr.status}`);
    const sd = await sr.json();
    (sd.response?.[0]?.league?.standings||[]).forEach(garr => {
      if (!garr.length) return;
      const gl = (garr[0].group||'').replace('Group ','');
      standings[gl] = garr.map(t => ({
        code: t.team?.name?.substring(0,3).toUpperCase()||'',
        name: t.team?.name||'', pts: t.points||0,
        w: t.all?.win||0, d: t.all?.draw||0, l: t.all?.lose||0,
        gf: t.all?.goals?.for||0, ga: t.all?.goals?.against||0,
        gd: t.goalsDiff||0, mp: t.all?.played||0
      }));
    });
    const fr = await fetch(`https://${API_HOST}/fixtures?league=${LEAGUE}&season=${SEASON}`, {headers:hdr});
    if (fr.ok) {
      const fd = await fr.json();
      allFixtures = (fd.response||[]).map(f => ({
        home: f.teams?.home?.name?.substring(0,3).toUpperCase()||'',
        away: f.teams?.away?.name?.substring(0,3).toUpperCase()||'',
        hs: f.goals?.home??null, as: f.goals?.away??null,
        status: f.fixture?.status?.short||'NS',
        date: f.fixture?.date||'',
        round: f.league?.round||'',
        venue: f.fixture?.venue?.name||'',
        homeWin: f.teams?.home?.winner, awayWin: f.teams?.away?.winner,
        fixtureId: f.fixture?.id
      }));
      bucketGroupMatches();
    }
  } catch (error) {
    console.error('API-Football fetch error:', error);
    throw error;
  }
}

// ── football-data.org ──
async function fetchFootballData() {
  try {
    const sr = await fetch('https://api.football-data.org/v4/competitions/WC/standings',
      {headers:{'X-Auth-Token':'YOUR_TOKEN'}});
    if (!sr.ok) throw new Error(`football-data.org failed: ${sr.status}`);
    const sd = await sr.json();
    (sd.standings||[]).forEach(s => {
      if (s.type !== 'TOTAL') return;
      const gl = (s.group||'').replace('GROUP_','');
      standings[gl] = (s.table||[]).map(t => ({
        code: t.team?.tla||'', name: t.team?.name||'',
        pts: t.points||0, w: t.won||0, d: t.draw||0, l: t.lost||0,
        gf: t.goalsFor||0, ga: t.goalsAgainst||0, gd: t.goalDifference||0,
        mp: t.playedGames||0
      }));
    });
  } catch (error) {
    console.error('football-data.org fetch error:', error);
    throw error;
  }
}

function bucketGroupMatches() {
  matchesByGroup = {};
  allFixtures.forEach(f => {
    const gm = (f.round||'').match(/Group\s*([A-L])/i);
    if (gm) {
      const g = gm[1];
      if (!matchesByGroup[g]) matchesByGroup[g] = [];
      matchesByGroup[g].push(f);
    }
  });
}

function initEmpty() {
  Object.keys(GROUPS).forEach(g => {
    if (!standings[g]) {
      standings[g] = GROUPS[g].map(c => ({code:c,name:NAMES[c]||c,pts:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,mp:0}));
    }
  });
}

// ──────────────────────────────────────────────
// RESOLVE BRACKET LABELS
// ──────────────────────────────────────────────
function getSorted(g) {
  const t = standings[g] || [];
  return [...t].sort((a,b) => b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);
}

function groupFinished(g) {
  const t = standings[g];
  return t && t.length > 0 && t.every(x => x.mp >= 3);
}

function resolve(label) {
  if (!label) return {name:'TBD', ok:false};
  // "1A","2B" etc
  const gp = label.match(/^(\d)([A-L])$/);
  if (gp) {
    const pos = parseInt(gp[1]), g = gp[2];
    if (groupFinished(g)) {
      const s = getSorted(g);
      if (s[pos-1]) { const c = s[pos-1].code; return {name:`${FLAGS[c]||''} ${c}`, code:c, ok:true}; }
    }
    return {name:label, ok:false};
  }
  // "3ABCF" – best 3rd from those groups (simplified: just show "3rd" until determined)
  if (/^\d[A-L]{2,}$/.test(label)) return {name:label.replace(/^(\d)/,'$1rd '), ok:false};
  // "W49","L65"
  const mr = label.match(/^([WL])(\d+)$/);
  if (mr) {
    const type = mr[1], mid = parseInt(mr[2]);
    const r = koResults[mid];
    if (r && r.winner) {
      const c = type==='W' ? r.winner : (r.homeTeam===r.winner?r.awayTeam:r.homeTeam);
      return {name:`${FLAGS[c]||''} ${c}`, code:c, ok:true};
    }
    return {name:label, ok:false};
  }
  return {name:label, ok:false};
}

// ──────────────────────────────────────────────
// RENDER
// ──────────────────────────────────────────────
function renderAll() { initEmpty(); renderGroups(); renderBracket(); renderMatches(); }

function renderGroups() {
  const grid = document.getElementById('groupsGrid');
  grid.innerHTML = '';
  Object.keys(GROUPS).forEach(g => {
    const teams = getSorted(g);
    const done = groupFinished(g);
    const matches = matchesByGroup[g] || [];

    let h = `<div class="group"><div class="group-header">GROUP ${g}</div><table>
      <tr><th></th><th>Pts</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th></tr>`;
    teams.forEach((t,i) => {
      const cls = [];
      if (i%2===1) cls.push('group-row-even');
      if (done && i<2) cls.push('qualified');
      if (done && i>=3) cls.push('eliminated');
      h += `<tr class="${cls.join(' ')}">
        <td>${t.code}</td>
        <td><b>${t.pts}</b></td><td>${t.mp}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
        <td>${t.gf}</td><td>${t.ga}</td><td>${t.gd>=0?'+':''}${t.gd}</td></tr>`;
    });
    h += '</table>';

    if (matches.length) {
      h += '<div class="group-matches"><h4>Matches</h4>';
      matches.forEach(m => {
        const played = m.status==='FT'||m.status==='AET'||m.status==='PEN';
        const live = m.status==='LIVE'||m.status==='1H'||m.status==='2H'||m.status==='HT';
        const sc = played||live ? `${m.hs??0} \u2013 ${m.as??0}` : 'vs';
        h += `<div class="group-match">
          <span class="gm-team right">${FLAGS[m.home]||''} ${m.home}</span>
          <span class="gm-score${!played&&!live?' pending':''}">${sc}</span>
          <span class="gm-team">${m.away} ${FLAGS[m.away]||''}</span>
          ${live?'<span class="gm-status">\u25CF LIVE</span>':''}
          ${played?`<span class="gm-status" style="color:#888">${m.status}</span>`:''}
        </div>`;
      });
      h += '</div>';
    }
    h += '</div>';
    grid.innerHTML += h;
  });
}

function renderKO(m) {
  const hm = resolve(m.home), aw = resolve(m.away);
  const r = koResults[m.id];
  const has = r && r.hs !== null;
  const live = r && ['LIVE','1H','2H','HT'].includes(r.status);
  let hc='team', ac='team';
  if (r?.winner) { if(r.winner===hm.code) hc+=' winner'; if(r.winner===aw.code) ac+=' winner'; }
  return `<div class="ko-match${live?' live-match':''}">
    <div class="match-info">${m.info}</div>
    <div class="${hc}"><span class="team-name">${hm.name}</span><span class="score">${has?r.hs:''}</span></div>
    <div class="${ac}"><span class="team-name">${aw.name}</span><span class="score">${has?r.as:''}</span></div>
  </div>`;
}

function renderBracket() {
  const a = document.getElementById('bracketArea');
  const fr = koResults[KO.final.id];
  const champ = fr?.winner;
  const banner = champ ? `<div class="champion-banner">${FLAGS[champ]||''} ${NAMES[champ]||champ} \u2013 WORLD CHAMPIONS!</div>` : '';

  a.innerHTML = `
    <div class="round"><div class="round-header">Round of 32</div>${KO.left_r32.map(renderKO).join('')}</div>
    <div class="round"><div class="round-header">Round of 16</div>${KO.left_r16.map(renderKO).join('')}</div>
    <div class="round"><div class="round-header">Quarterfinals</div>${KO.left_qf.map(renderKO).join('')}</div>
    <div class="round"><div class="round-header">Semifinals</div>${KO.left_sf.map(renderKO).join('')}</div>
    <div class="final-area">
      ${banner}
      <div class="trophy">\u{1F3C6}</div>
      <div class="final-label">FINAL</div>
      ${renderKO(KO.final)}
      <div class="third-label">3RD PLACE</div>
      ${renderKO(KO.third)}
    </div>
    <div class="round"><div class="round-header">Semifinals</div>${KO.right_sf.map(renderKO).join('')}</div>
    <div class="round"><div class="round-header">Quarterfinals</div>${KO.right_qf.map(renderKO).join('')}</div>
    <div class="round"><div class="round-header">Round of 16</div>${KO.right_r16.map(renderKO).join('')}</div>
    <div class="round"><div class="round-header">Round of 32</div>${KO.right_r32.map(renderKO).join('')}</div>
  `;
}

function renderMatches() {
  const el = document.getElementById('matchesList');
  if (!allFixtures.length) {
    el.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">No match data loaded yet. Connect a data source to see all fixtures.</p>';
    return;
  }
  // Sort by date
  const sorted = [...allFixtures].sort((a,b) => new Date(a.date)-new Date(b.date));
  let h = '<h3 style="margin-bottom:12px;font-size:1.2rem;">All Matches</h3>';
  sorted.forEach(m => {
    const played = ['FT','AET','PEN'].includes(m.status);
    const live = ['LIVE','1H','2H','HT'].includes(m.status);
    const dt = m.date ? new Date(m.date).toLocaleDateString('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) + ' CDT' : '';
    const sc = played||live ? `${m.hs??0} \u2013 ${m.as??0}` : 'vs';
    h += `<div class="match-row">
      <span class="mr-date">${dt}</span>
      <span class="mr-home">${FLAGS[m.home]||''} ${m.home}</span>
      <span class="gm-score${!played&&!live?' pending':''}">${sc}</span>
      <span class="mr-away">${m.away} ${FLAGS[m.away]||''}</span>
      <span class="mr-status" style="color:${live?'var(--green)':'#888'}">${m.status}</span>
      <span class="mr-venue">${m.venue||''}</span>
      <span class="mr-round">${m.round||''}</span>
    </div>`;
  });
  el.innerHTML = h;
  // Re-apply filter if search has value
  const searchVal = document.getElementById('matchSearch').value;
  if (searchVal) filterMatches();
}

// ──────────────────────────────────────────────
// UI
// ──────────────────────────────────────────────
function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.remove('active');
    t.setAttribute('aria-selected', 'false');
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  btn.setAttribute('aria-selected', 'true');
  document.getElementById('panel-'+name).classList.add('active');
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const newTheme = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('wc2026_theme', newTheme);
  const toggle = document.getElementById('themeToggle');
  toggle.innerHTML = newTheme === 'dark' ? '&#9728;' : '&#127765;';
}

function initTheme() {
  const saved = localStorage.getItem('wc2026_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  const toggle = document.getElementById('themeToggle');
  toggle.innerHTML = saved === 'dark' ? '&#9728;' : '&#127765;';
}

function saveApiKey() {
  API_KEY = document.getElementById('apiKeyInput').value.trim();
  if (API_KEY) {
    localStorage.setItem('wc2026_apikey', API_KEY);
    document.getElementById('configBar').style.display = 'none';
    fetchAllData();
  }
}

function filterMatches() {
  const query = document.getElementById('matchSearch').value.toLowerCase();
  const rows = document.querySelectorAll('.match-row');
  rows.forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display = text.includes(query) ? 'flex' : 'none';
  });
}

// Auto-refresh
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initEmpty();
  renderAll();
  fetchAllData();
  const cb = document.getElementById('autoRefresh');
  function setTimer() {
    if (timer) clearInterval(timer);
    if (cb.checked) timer = setInterval(fetchAllData, 60000);
  }
  cb.addEventListener('change', setTimer);
  setTimer();
});
</script>
